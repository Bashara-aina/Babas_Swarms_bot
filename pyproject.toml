[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "babas-swarms-bot"
version = "4.1.0"
description = "Legion — AI-powered Telegram bot for full desktop control and multi-agent orchestration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bashara Aina", email = "71659607+Bashara-aina@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = ["telegram", "bot", "ai", "llm", "agent", "computer-use"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "aiogram>=3.4.1,<4.0.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.57.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "aiosqlite>=0.20.0",
    "psutil>=5.9.0",
    "playwright>=1.40.0",
    "openai-agents==0.4.2",
    "camel-ai==0.2.89",
    "ag2==0.11.4",
    "smolagents==1.23.0",
    "pydantic-ai-slim==1.61.0",
    "agentops==0.3.26",
    "networkx>=3.0",
    "knowledge-graph>=0.0.33",
    "swarms==9.0.4",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."] 
omit = [
    "tests/*",
    "*/site-packages/*",
    "setup.py",
]

[tool.coverage.report]
fail_under = 15
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F811", "UP035", "UP045", "RUF013", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
strict = false
exclude = [
  "ext/",
  "agents/_archive/__broken_archive__/",
  "agents/_archive/",
  "agents/research/",
  "cekwajar\\.id/",
  "\\.wiki/",
  "\\.claude/",
  "\\.opencode/",
  "node_modules/",
]
