# Legion v4 — support services
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Logs:   docker-compose logs -f

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: swarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: swarm-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:latest
    container_name: legion-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-legion}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Tokyo
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Uncomment to run the bot itself in Docker (needs X11/display passthrough)
  # legion-bot:
  #   build: .
  #   container_name: legion-bot
  #   env_file: .env
  #   volumes:
  #     - .:/app
  #     - /tmp/.X11-unix:/tmp/.X11-unix
  #   environment:
  #     - DISPLAY=${DISPLAY}
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     chromadb:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 2g
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "50m"
  #       max-file: "3"

  # --- Optional profiles (do not start by default) ---
  # docker compose --profile livekit up -d livekit
  livekit:
    image: livekit/livekit-server:latest
    container_name: legion-livekit
    profiles: ["livekit"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --dev --bind 0.0.0.0
    restart: unless-stopped

  # docker compose --profile screenpipe up -d screenpipe
  # Verify current image/tag in Screenpipe docs; may need extra devices/volumes on Linux.
  screenpipe:
    image: ghcr.io/mediar-ai/screenpipe:latest
    container_name: legion-screenpipe
    profiles: ["screenpipe"]
    ports:
      - "3030:3030"
    restart: "no"

volumes:
  redis_data:
    driver: local
  chroma_data:
    driver: local
  n8n_data:
    driver: local
