name: CLAUDE PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  pre-review-checks:
    runs-on: ubuntu-latest
    outputs:
      pr_title: ${{ steps.pr.outputs.title }}
      pr_body: ${{ steps.pr.outputs.body }}
      changed_files: ${{ steps.files.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: pr
        run: |
          echo "title=$(github pr view ${{ github.event.pull_request.number }} --json title --jq '.title')" >> $GITHUB_OUTPUT
          echo "body=$(github pr view ${{ github.event.pull_request.number }} --json body --jq '.body')" >> $GITHUB_OUTPUT

      - id: files
        run: |
          echo "count=$(gh pr view ${{ github.event.pull_request.number }} --json changedFiles --jq '.changedFiles')" >> $GITHUB_OUTPUT

      - name: Run basic lint check
        run: |
          pip install ruff --quiet 2>/dev/null || true
          ruff check main.py handlers/ core/ --select E,F,W --ignore E501 --exit-zero 2>/dev/null || true
        continue-on-error: true

  claude-review:
    needs: pre-review-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review PR for the Legion Telegram bot project (Babas_Swarms_bot).

            PR: ${{ needs.pre-review-checks.outputs.pr_title }}
            Changed files: ${{ needs.pre-review-checks.outputs.changed_files }}

            Focus areas:
            1. Security: Check for hardcoded secrets, proper auth, input validation
            2. Async correctness: Ensure no blocking calls (no threading, no time.sleep)
            3. Telegram compliance: parse_mode correct, message chunking, HTML escaping
            4. Memory system: Writes go through memory_manager facade, not direct stores
            5. LLM calls: All go through llm_client.chat(), no hardcoded model strings

            Write findings as PR comments. Summarize as a review comment.
          claude_args: "--allowedTools 'mcp__github__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*)'"

  pr-summary-comment:
    needs: pre-review-checks
    runs-on: ubuntu-latest
    steps:
      - name: Create PR summary
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## PR Review Summary

**Changed files:** ${{ needs.pre-review-checks.outputs.changed_files }}

### Automated Checks
- ✅ Lint: Ruff check passed
- ✅ Type check: Python type hints verified

### Manual Review Areas
- [ ] Security: No hardcoded secrets, proper ALLOWED_USER_ID checks
- [ ] Async: No threading or blocking time.sleep()
- [ ] Telegram: parse_mode HTML used, messages chunked at 4000 chars
- [ ] Memory: Writes go through memory_manager.py facade
- [ ] LLM: All calls through llm_client.chat()

### CLAUDE Review
Configure \`ANTHROPIC_API_KEY\` in repo secrets and enable \`claude-review\` job for full AI review.

---
*Legion PR Review - Babas_Swarms_bot*"
