name: mypy
on: [push, pull_request]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -U pip
      - run: pip install -r requirements-typecheck.txt
      - run: pip install mypy types-pytz types-aiofiles types-requests types-PyYAML
      # Incremental mypy adoption: enforce on typed/stable surfaces first.
      - run: mypy config data/message_count.py tools/rumahlabuh_thread_generator.py --ignore-missing-imports --explicit-package-bases
