name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --use-deprecated=legacy-resolver --prefer-binary -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check \
            main.py llm_client.py router.py agents.py task_orchestrator.py computer_agent.py \
            handlers/ core/ bridges/ tests/ \
            --select E,F,W --ignore E501 --exit-zero

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: "0:test"
          ALLOWED_USER_ID: "12345"
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_computer_control.py \
            -x

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v5-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-v5-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --use-deprecated=legacy-resolver --prefer-binary -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run v5 integration tests
        env:
          TELEGRAM_BOT_TOKEN: "0:test"
          ALLOWED_USER_ID: "12345"
        run: python -m pytest tests/test_v5_integrations.py -v --tb=short

  verify-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v5-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-v5-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --use-deprecated=legacy-resolver --prefer-binary -r requirements.txt

      - name: Verify wiring
        run: python scripts/verify_wiring.py
