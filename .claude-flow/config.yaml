# RuFlo V3 Runtime Configuration
# Generated: 2026-05-24
# Auto-managed — do not edit manually

version: "3.0.0"

swarm:
  topology: hierarchical-mesh
  maxAgents: 15
  autoScale: true
  coordinationStrategy: consensus

memory:
  backend: hybrid
  enableHNSW: true
  persistPath: .claude-flow/data
  cacheSize: 100
  # ADR-049: Self-Learning Memory
  learningBridge:
    enabled: true
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: true
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: true
    defaultScope: project

neural:
  enabled: true
  modelPath: .claude-flow/neural

hooks:
  enabled: true
  autoExecute: true

daemon:
  autoStart: true
  workers:
    - map
    - audit
    - optimize
    - consolidate
    - testgaps
  schedules:
    map:
      interval: 900000  # 15 minutes
      priority: normal
    audit:
      interval: 14400000  # 4 hours
      priority: critical
    optimize:
      interval: 7200000  # 2 hours
      priority: high
    consolidate:
      interval: 1800000  # 30 minutes
      priority: low
    testgaps:
      interval: 1200000  # 20 minutes
      priority: normal

mcp:
  autoStart: true
  port: 3000
  servers:
    - claude-flow
    - agentic-flow
    - symphony
    - obsidian