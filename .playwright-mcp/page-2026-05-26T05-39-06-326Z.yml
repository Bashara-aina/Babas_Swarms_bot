      - heading "よくある質問" [level=2] [ref=e908]
      - generic [ref=e909]:
        - generic [ref=e911] [cursor=pointer]:
          - generic [ref=e913]: TokyoからJakartaへの航空券の最安料金はいくらですか？
          - img [ref=e915]
        - paragraph [ref=e919]: 32,644円, select, null TokyoからJakartaへの最安料金のデータは現在ありません。 other 当社のデータによると、TokyoからJakartaへの航空券は、32,644円からご利用いただけます。クーポンや追加のプロモーションを使うとさらにお得に予約することができます。
      - generic [ref=e920]:
        - generic [ref=e922] [cursor=pointer]:
          - generic [ref=e924]: Jakartaへのフライトのために、空港にはどのくらい前に到着する必要がありますか？
          - img [ref=e926]
        - paragraph [ref=e930]: 国内線の場合、予定出発時刻の少なくとも1時間前にTokyo空港に到着することをお勧めします。国際線の場合、スムーズにチェックイン、セキュリティチェック、遅延に備えるため、出発時刻の少なくとも2時間前に空港に到着することを目指してください。？各航空会社にはチェックインと手荷物預かりの締め切り時間に関するルールがあるため、念のため、Tokyoに向かう前に航空会社のHPにて確認するようにしてください。
      - generic [ref=e931]:
        - generic [ref=e933] [cursor=pointer]:
          - generic [ref=e935]: TokyoからJakartaへの航空券を購入するのに最適な時期はいつですか？
          - img [ref=e937]
        - paragraph [ref=e941]: 航空券を購入する最適なタイミングは目的地やエアラインによっても様々ですが、通常、国内線の場合、出発の4～6週間前、国際線の場合、少なくとも2～3か月前に予約するのが最適です。トラベロカをつかって航空券の価格変動を常に監視し、アラートを設定することも可能です。
      - generic [ref=e942]:
        - generic [ref=e944] [cursor=pointer]:
          - generic [ref=e946]: Jakartaへの航空券で最も安い日はいつですか？
          - img [ref=e948]
        - paragraph [ref=e952]: 最も安い航空券の日程は予約時期によって異なりますが一般的に、平日（特に火曜・水曜）、早朝や深夜のフライト、オフシーズンの旅行は料金が安くなる傾向があります。常に価格は変動するためトラベロカの検索機能を活用し、柔軟な日程で比較するのがおすすめです。また、早めの予約やセール情報をチェックすると、さらにお得なチケットが見つかる可能性があります。
      - generic [ref=e953]:
        - generic [ref=e955] [cursor=pointer]:
          - generic [ref=e957]: 航空券を予約する際に知っておくべきことは？
          - img [ref=e959]
        - paragraph [ref=e963]: 航空会社ごとに手荷物のサイズ・重量制限が異なるため、事前に確認しておきましょう。また、予期せぬ予定変更に備え、払い戻しや日程変更の条件を確認しておくことが大切です。
      - generic [ref=e964]:
        - generic [ref=e966] [cursor=pointer]:
          - generic [ref=e968]: TokyoからJakartaへの航空券には、パスポートとビザが必要ですか？
          - img [ref=e970]
        - paragraph [ref=e974]: 国際線の場合、パスポートは常に必要です。これには、国際線への国内線乗り継ぎも含まれます。ビザの有無についてはJakartaの入国規定によって異なりますので、必ずご確認ください。国内線の場合、パスポートもビザも不要です。
      - generic [ref=e975]:
        - generic [ref=e977] [cursor=pointer]:
          - generic [ref=e979]: なぜトラベロカで航空券を予約するべきなのでしょうか？
          - img [ref=e981]
        - paragraph [ref=e985]: トラベロカでは、豊富な種類のお支払い方法に対応しており、航空券の予約後も手数料無料で日程を変更するオプションも取り揃えております。また、出発直前の予約にも対応しています。
      - generic [ref=e986]:
        - generic [ref=e988] [cursor=pointer]:
          - generic [ref=e990]: TokyoからJakartaへの航空便の所要時間は何時間ですか？
          - img [ref=e992]
        - paragraph [ref=e996]: 直行便の場合、TokyoからJakartaへのフライトの所要時間は約7時間50分です。
      - generic [ref=e997]:
        - generic [ref=e999] [cursor=pointer]:
          - generic [ref=e1001]: トラベロカで航空券の購入につかえるクーポンや実施中のプロモーションはありますか？
          - img [ref=e1003]
        - paragraph [ref=e1007]:
          - text: 現在、航空券購入に活用できるクーポンはありませんが、ホテル、アクティビティ、レンタカーを予約する場合は、初回購入時にプロモーションコード
