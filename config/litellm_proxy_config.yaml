model_list:
  - model_name: minimax/MiniMax-M3
    litellm_params:
      model: minimax/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: minimax/MiniMax-M3
    litellm_params:
      model: minimax/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: ollama-llama3.3
    litellm_params:
      model: ollama/llama3.3:70b
      api_base: http://localhost:11434
      api_key: os.environ/OLLAMA_API_KEY

litellm_settings:
  set_verbose: false
  drop_params: true
  store_model_results: false
  disable_constraints: true
  no-cache: true

general_settings:
  master_key: "legion-proxy-key"

budget_manager:
  planner:
    max_budget: 0.20
    budget_duration: "1d"
  worker:
    max_budget: 0.50
    budget_duration: "1d"
  reviewer:
    max_budget: 0.10
    budget_duration: "1d"
  wikibot:
    max_budget: 0.05
    budget_duration: "1d"