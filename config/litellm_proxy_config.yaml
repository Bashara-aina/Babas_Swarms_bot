budget_manager:
  planner:
    budget_duration: 1d
    max_budget: 0.2
  reviewer:
    budget_duration: 1d
    max_budget: 0.1
  wikibot:
    budget_duration: 1d
    max_budget: 0.05
  worker:
    budget_duration: 1d
    max_budget: 0.5
general_settings: null
litellm_settings:
  default_headers:
    HTTP-Referer: https://swarm-bot.ai
    X-Title: swarm-bot
  disable_constraints: true
  drop_params: true
  no-cache: true
  set_verbose: false
  store_model_results: false
model_list:
- litellm_params:
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_GO_API_KEY
    drop_params: true
    model: openai/opencode-go/*
    rpm: 500
  model_name: opencode-go/*
- litellm_params:
    api_base: https://opencode.ai/zen/go/v1
    api_key: os.environ/OPENCODE_GO_API_KEY
    drop_params: true
    model: openai/deepseek-v4-flash
    rpm: 500
    stream_timeout: 300
    timeout: 300
  model_name: deepseek-v4-flash
- litellm_params:
    api_base: https://openrouter.ai/api/v1
    api_key: os.environ/OPENROUTER_API_KEY
    drop_params: true
    model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
    rpm: 10
    stream_timeout: 300
    timeout: 300
  model_name: nemotron
- litellm_params:
    api_base: https://openrouter.ai/api/v1
    api_key: os.environ/OPENROUTER_API_KEY
    drop_params: true
    model: openai/nvidia/nemotron-3-ultra-550b-a55b:free
    rpm: 30
    timeout: 180
  model_name: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
- litellm_params:
    api_base: https://openrouter.ai/api/v1
    api_key: os.environ/OPENROUTER_API_KEY
    drop_params: true
    model: openrouter/*
    rpm: 500
  model_name: openrouter/*
- litellm_params:
    api_base: https://api.minimax.io/anthropic
    api_key: os.environ/MINIMAX_API_KEY
    drop_params: true
    model: anthropic/MiniMax-M3
    rpm: 500
    stream_timeout: 300
    timeout: 300
  model_name: minimax-coding-plan/MiniMax-M3
- litellm_params:
    api_base: https://api.minimax.io/anthropic
    api_key: os.environ/MINIMAX_API_KEY
    drop_params: true
    model: anthropic/MiniMax-M3
    rpm: 500
    stream_timeout: 300
    timeout: 300
  model_name: minimax-m3
- litellm_params:
    api_base: http://localhost:11434
    api_key: os.environ/OLLAMA_API_KEY
    model: ollama/llama3.3:70b
  model_name: ollama-llama3.3
