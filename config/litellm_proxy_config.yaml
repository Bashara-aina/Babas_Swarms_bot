model_list:
  - model_name: minimax-primary
    litellm_params:
      model: minimax-coding-plan/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: minimax-coding-plan/MiniMax-M2.7
    litellm_params:
      model: minimax-coding-plan/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: minimax-text
    litellm_params:
      model: minimax-coding-plan/MiniMax-Text-01
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: ollama-llama3.3
    litellm_params:
      model: ollama_chat/llama3.3:70b
      api_base: http://localhost:11434
      api_key: os.environ/OLLAMA_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - minimax-primary:
        - minimax-text
        - ollama-llama3.3
  retry_policy:
    BadRequestErrorRetries: 0
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 2

litellm_settings:
  set_verbose: false
  drop_params: true
  store_model_results: false
  disable_constraints: true
  no-cache: true

general_settings:
  master_key: "legion-proxy-key"

budget_manager:
  planner:
    max_budget: 0.20
    budget_duration: "1d"
  worker:
    max_budget: 0.50
    budget_duration: "1d"
  reviewer:
    max_budget: 0.10
    budget_duration: "1d"
  wikibot:
    max_budget: 0.05
    budget_duration: "1d"