# config/models.yaml — OpenCode Go (deepseek-v4-pro primary)
# All model IDs use opencode-go prefix convention
# Last updated: MiniMax → OpenCode Go migration (Jun 2026)

providers:
  opencode-go:
    base_url: "https://opencode.ai/zen/go/v1"
    api_key_env: "OPENCODE_GO_API_KEY"
    daily_limit: null

  ollama:
    base_url: "http://localhost:11434"
    api_key_env: null
    daily_limit: null

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    daily_limit: null

models:
  # PRIMARY — all tasks use this
  deepseek-v4-pro:
    provider: opencode-go
    model_id: "opencode-go/deepseek-v4-pro"
    context_window: 1048576
    max_tokens: 8192
    temperature_conversation: 0.2
    temperature_code: 0.1
    strengths: [coding, reasoning, conversation, general, long-context]
    cost_per_1m_tokens: 0.0
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Fast model — review, search, autocomplete
  deepseek-v4-flash:
    provider: opencode-go
    model_id: "opencode-go/deepseek-v4-flash"
    context_window: 1048576
    max_tokens: 4096
    temperature_conversation: 0.3
    temperature_code: 0.1
    strengths: [coding, review, search, fast]
    cost_per_1m_tokens: 0.0
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Agent primary — complex orchestration (used as Opus by Claude Code)
  minimax-m3:
    provider: opencode-go
    model_id: "opencode-go/minimax-m3"
    context_window: 1048576
    max_tokens: 8192
    temperature_conversation: 0.2
    temperature_code: 0.1
    strengths: [orchestration, reasoning, architecture, coding, conversation, long-context]
    cost_per_1m_tokens: 0.0
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # OpenRouter — nemotron free model (emergency fallback)
  nemotron-free:
    provider: openrouter
    model_id: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    context_window: 1000000
    max_tokens: 4096
    temperature_conversation: 0.3
    temperature_code: 0.1
    strengths: [coding, reasoning, conversation, general]
    cost_per_1m_tokens: 0.0
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Vision ONLY — image/multimodal inputs via RTX 3060
  gemma4-local:
    provider: ollama
    model_id: "ollama_chat/gemma4:e4b"
    context_window: 8192
    max_tokens: 2048
    strengths: [vision, local, privacy]
    cost_per_1m_tokens: 0.0
    daily_limit: null
    vram_required_gb: 6
    notes: "RTX 3060 12GB safe. Gemma4 E4B MoE activates ~4B params/token."
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Embeddings ONLY — not for chat, ChromaDB/mem0 only
  nomic-embed-text:
    provider: ollama
    model_id: "ollama_chat/nomic-embed-text"
    context_window: 8192
    max_tokens: 2048
    strengths: [embeddings, local, privacy]
    cost_per_1m_tokens: 0.0
    daily_limit: null
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

# Wildcard catch-all: any unmatched model request → primary
wildcard_fallback: deepseek-v4-pro

# Ruflo swarm agents use this model
ruflo_model: deepseek-v4-pro

# Complexity tiers — all route to opencode-go
complexity_tiers:
  lightweight:    [opencode-go]
  midweight:      [opencode-go]
  heavyweight:   [opencode-go]
