# config/models.yaml — MiniMax-M2.7 ONLY
# All model IDs use litellm prefix convention
# Last updated: v3.1 lock (Claude)

providers:
  minimax:
    base_url: "https://api.minimax.chat/v1"
    api_key_env: "MINIMAX_API_KEY"
    daily_limit: null

  ollama:
    base_url: "http://localhost:11434"
    api_key_env: null
    daily_limit: null

models:
  # PRIMARY — all tasks use this
  minimax-m2-7:
    provider: minimax
    model_id: "minimax-coding-plan/MiniMax-M2.7"
    context_window: 204800
    max_tokens: 8192
    temperature_conversation: 0.2
    temperature_code: 0.1
    strengths: [coding, reasoning, conversation, general]
    cost_per_1m_tokens: 0.0
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Rate-limit fallback ONLY — 429 from M2.7 triggers this
  minimax-text-01:
    provider: minimax
    model_id: "minimax-coding-plan/MiniMax-Text-01"
    context_window: 245760
    max_tokens: 8192
    temperature_conversation: 0.2
    temperature_code: 0.1
    strengths: [long-context, reasoning, general]
    cost_per_1m_tokens: 0.0
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Vision ONLY — image/multimodal inputs via RTX 3060
  gemma4-local:
    provider: ollama
    model_id: "ollama_chat/gemma4:e4b"
    context_window: 8192
    max_tokens: 2048
    strengths: [vision, local, privacy]
    cost_per_1m_tokens: 0.0
    daily_limit: null
    vram_required_gb: 6
    notes: "RTX 3060 12GB safe. Gemma4 E4B MoE activates ~4B params/token."
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

  # Embeddings ONLY — not for chat, ChromaDB/mem0 only
  nomic-embed-text:
    provider: ollama
    model_id: "ollama_chat/nomic-embed-text"
    context_window: 8192
    max_tokens: 2048
    strengths: [embeddings, local, privacy]
    cost_per_1m_tokens: 0.0
    daily_limit: null
    daily_limit_warning_threshold: 0.8
    avg_latency_ms: null

# Wildcard catch-all: any unmatched model request → M2.7
wildcard_fallback: minimax-m2-7

# Complexity tiers — all route to minimax only
complexity_tiers:
  lightweight:    [minimax]
  midweight:      [minimax]
  heavyweight:   [minimax]