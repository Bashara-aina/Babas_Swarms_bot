design:
  default_agent: ux_designer
  description: UI/UX design, branding, visual design, accessibility, prototyping
  agents:
    taste_frontend_architect:
      description: Senior taste-frontend architect — runs the taste-skill pipeline
        (brief inference → dial setting → variant selection → implementation →
        pre-flight checklist). Orchestrates the 10 design sub-agents, enforces
        anti-slop discipline, ships Linear/Vercel/Stripe/Oxide-grade interfaces.
      primary_model: minimax-m3
      fallbacks:
      - minimax-text-01
      capabilities:
      - taste-skill
      - design-taste
      - frontend-architect
      - brief-inference
      - dial-setting
      - design-variance
      - motion-intensity
      - visual-density
      - design-system
      - anti-slop
      - handoff
      - typography
      - motion-physics
      - color-discipline
      - layout
      tools:
      - interpreter
      complexity_tier: heavyweight
    ux_designer:
      description: "UI/UX design, user research, wireframes, interaction design. taste-skill loading: ALWAYS load minimalist-skill + output-skill; for broader briefs also load taste-skill v2. Dial defaults 6/4/3 (VARIANCE/MOTION/DENSITY) — calm, restrained, editorial. Honor the brief-inference line and 18-item pre-flight checklist from .claude/rules/taste-router.md before any output."
      primary_model: minimax-m3
      fallbacks:
      - minimax-text-01
      capabilities:
      - ux
      - ui
      - figma
      - user-research
      - wireframe
      - interaction
      - design
      - taste-skill-minimalist
      - taste-skill-output
      - dial-6-4-3
      tools: []
      complexity_tier: midweight
    graphic_designer:
      description: "Visual design, branding assets, typography, graphic creation. taste-skill loading: ALWAYS load brutalist-skill (typography) + output-skill; for brand refinement also load minimalist-skill. Dial defaults 7/5/4 — visual-first, brand-faithful. Type is the design; weight, scale, and letter-spacing matter more than decoration."
      primary_model: minimax-m3
      fallbacks:
      - minimax-text-01
      capabilities:
      - graphic
      - visual
      - typography
      - brand
      - design
      - assets
      - layout
      - taste-skill-brutalist
      - taste-skill-output
      - dial-7-5-4
      tools: []
      complexity_tier: lightweight
    branding_strategist:
      description: "Brand strategy, identity, positioning, storytelling, voice. taste-skill loading: ALWAYS load minimalist-skill (color discipline) + output-skill; for premium brand also load soft-skill. Dial defaults 6/4/3 — voice + identity, low motion. Brand is restraint, color is load-bearing."
      primary_model: minimax-m3
      fallbacks:
      - minimax-text-01
      capabilities:
      - branding
      - strategy
      - identity
      - positioning
      - storytelling
      - logo
      - taste-skill-minimalist
      - taste-skill-output
      - dial-6-4-3
      tools: []
      complexity_tier: midweight
    motion_artist:
      description: "Motion graphics, animation, After Effects concepts, video design. taste-skill loading: ALWAYS load soft-skill (haptic motion) + output-skill; for strict GSAP also load gpt-tasteskill. Dial defaults 8/9/4 — max motion, less density. Motion is the design; easing, duration, and physics matter more than choreography."
